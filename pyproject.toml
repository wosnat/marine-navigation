[project]
name = "marine-navigation"
version = "0.1.0"
description = "Exploring environmental cues marine organisms may use for navigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.26.0",
    "cmocean>=4.0.3",
    "dask>=2026.8.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marine_navigation"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
